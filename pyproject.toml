[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-threat-feature-extractor"
version = "0.1.0"
description = "Passive flow and metadata feature extraction for the SIH lab"
requires-python = ">=3.11"

[project.scripts]
extract-passive-features = "feature_extractor.cli:main"
